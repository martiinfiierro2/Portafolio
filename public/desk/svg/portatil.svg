<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="470"
  viewBox="0 0 760 470"
  role="img"
  aria-labelledby="portatil-title portatil-description"
>
  <title id="portatil-title">Portátil cerrado con monograma MF</title>
  <desc id="portatil-description">
    Portátil de aluminio gris plata en perspectiva cenital. La tapa tiene una luz amplia a la
    izquierda, grano fino, cantos redondeados y un monograma oscuro. Dibujo vectorial sin
    fotografías.
  </desc>
  <defs>
    <path
      id="laptop-lid-outline"
      d="M70 25H685Q706 25 710 47L746 396Q750 422 723 426H38Q10 421 17 397L45 48Q48 25 70 25Z"
    />
    <clipPath id="laptop-lid-clip"><use href="#laptop-lid-outline" /></clipPath>
    <linearGradient
      id="laptop-metal"
      x1="42"
      y1="23"
      x2="692"
      y2="443"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#b5b7be" />
      <stop offset="0.2" stop-color="#979ba5" />
      <stop offset="0.51" stop-color="#858a96" />
      <stop offset="0.78" stop-color="#717783" />
      <stop offset="1" stop-color="#59616e" />
    </linearGradient>
    <radialGradient
      id="laptop-window-light"
      cx="54"
      cy="80"
      r="485"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 -25) scale(1 1.25)"
    >
      <stop stop-color="#fffaf5" stop-opacity="0.72" />
      <stop offset="0.14" stop-color="#fbf5f3" stop-opacity="0.52" />
      <stop offset="0.42" stop-color="#e8e5e9" stop-opacity="0.2" />
      <stop offset="0.76" stop-color="#dee1e9" stop-opacity="0.035" />
      <stop offset="1" stop-color="#dee1e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient
      id="laptop-left-glint"
      cx="29"
      cy="61"
      r="200"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(17 -85) scale(0.45 2.3)"
    >
      <stop stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="0.33" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient
      id="laptop-soft-reflection"
      cx="271"
      cy="276"
      r="330"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 45) scale(1 0.8)"
    >
      <stop stop-color="#d0ccd5" stop-opacity="0.16" />
      <stop offset="0.48" stop-color="#bbb7c2" stop-opacity="0.07" />
      <stop offset="1" stop-color="#bbb7c2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="laptop-lower-shade" cx="0.78" cy="1.04" r="0.74">
      <stop stop-color="#111b2b" stop-opacity="0.2" />
      <stop offset="0.38" stop-color="#1f2836" stop-opacity="0.08" />
      <stop offset="1" stop-color="#1f2836" stop-opacity="0" />
    </radialGradient>
    <linearGradient
      id="laptop-rim"
      x1="17"
      y1="36"
      x2="730"
      y2="420"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.18" stop-color="#f1e9e6" stop-opacity="0.58" />
      <stop offset="0.52" stop-color="#e2e4eb" stop-opacity="0.28" />
      <stop offset="1" stop-color="#303949" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="laptop-edge" x1="0" y1="419" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#abb0b9" />
      <stop offset="0.16" stop-color="#4b5059" />
      <stop offset="0.37" stop-color="#151a21" />
      <stop offset="0.68" stop-color="#282320" />
      <stop offset="0.87" stop-color="#6f5340" />
      <stop offset="1" stop-color="#241c16" />
    </linearGradient>
    <linearGradient
      id="laptop-bottom-glint"
      x1="17"
      y1="435"
      x2="746"
      y2="435"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#b49b7c" stop-opacity="0.58" />
      <stop offset="0.24" stop-color="#d2b58e" stop-opacity="0.9" />
      <stop offset="0.54" stop-color="#937961" stop-opacity="0.3" />
      <stop offset="1" stop-color="#b18c63" stop-opacity="0.67" />
    </linearGradient>
    <linearGradient id="laptop-logo-metal" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#24262c" />
      <stop offset="0.48" stop-color="#17191e" />
      <stop offset="1" stop-color="#22252a" />
    </linearGradient>
    <filter
      id="laptop-grain"
      x="0"
      y="0"
      width="100%"
      height="100%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.66"
        numOctaves="3"
        seed="17"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.16" /></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" />
      <feBlend in="SourceGraphic" mode="soft-light" />
    </filter>
    <filter
      id="laptop-surface-cloud"
      x="0"
      y="0"
      width="100%"
      height="100%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.023 0.035"
        numOctaves="3"
        seed="5"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.055" /></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" />
      <feBlend in="SourceGraphic" mode="soft-light" />
    </filter>
    <filter
      id="laptop-shadow"
      x="-12%"
      y="-20%"
      width="125%"
      height="150%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="6" dy="15" stdDeviation="9" flood-color="#35281b" flood-opacity="0.28" />
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#211a14" flood-opacity="0.47" />
    </filter>
  </defs>
  <g filter="url(#laptop-shadow)">
    <path
      d="M17 396v14q0 25 30 28h664q35-1 35-24v-18q-1 26-29 30H43q-25-1-26-30Z"
      fill="url(#laptop-edge)"
    />
    <path
      d="M27 431q7 7 20 7h664q21 0 29-10"
      fill="none"
      stroke="url(#laptop-bottom-glint)"
      stroke-width="1.5"
    />
    <path d="M38 429h683" stroke="#111820" stroke-opacity="0.9" stroke-width="1.4" />
    <path d="M43 436h268m139 0h259" stroke="#181713" stroke-opacity="0.68" stroke-width="1.1" />
    <path d="M318 435h126l-7 2H325Z" fill="#645e58" fill-opacity="0.58" />
    <g id="lid-metal">
      <g clip-path="url(#laptop-lid-clip)">
        <g filter="url(#laptop-grain)">
          <g filter="url(#laptop-surface-cloud)">
            <use href="#laptop-lid-outline" fill="url(#laptop-metal)" />
            <use href="#laptop-lid-outline" fill="url(#laptop-window-light)" />
            <use href="#laptop-lid-outline" fill="url(#laptop-left-glint)" />
            <use href="#laptop-lid-outline" fill="url(#laptop-soft-reflection)" />
            <use href="#laptop-lid-outline" fill="url(#laptop-lower-shade)" />
          </g>
        </g>
      </g>
      <use href="#laptop-lid-outline" fill="none" stroke="url(#laptop-rim)" stroke-width="1.65" />
      <path
        d="M69 26h613q19 0 24 19"
        fill="none"
        stroke="#e2e3e9"
        stroke-opacity="0.36"
        stroke-width="0.85"
      />
      <path
        d="M49 48 20 393q-3 22 15 28"
        fill="none"
        stroke="#fff8ed"
        stroke-opacity="0.44"
        stroke-width="1.4"
      />
      <path
        d="M25 413q4 13 20 13h677q17-1 23-13"
        fill="none"
        stroke="#18202b"
        stroke-opacity="0.45"
        stroke-width="1.25"
      />
      <path d="M47 425h674" stroke="#c1c2c6" stroke-opacity="0.22" stroke-width="0.75" />
    </g>
    <g id="lid-monogram" transform="translate(324 178) scale(1.48)">
      <path
        d="M3 54V10h10l14 23 14-23h36v9H52v10h21v9H52v16H42V27L27 47 12 27v27Z"
        transform="translate(-0.3 0.65)"
        fill="#bcc0c7"
        fill-opacity="0.18"
      />
      <path
        d="M3 54V10h10l14 23 14-23h36v9H52v10h21v9H52v16H42V27L27 47 12 27v27Z"
        fill="url(#laptop-logo-metal)"
      />
    </g>
  </g>
</svg>

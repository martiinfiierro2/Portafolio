<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="470"
  viewBox="0 0 760 470"
  role="img"
  aria-labelledby="portatil-tapa-title portatil-tapa-description"
>
  <title id="portatil-tapa-title">Tapa del portátil</title>
  <desc id="portatil-tapa-description">
    Tapa independiente, sin sombra exterior, para animar su apertura. El eje de bisagra está en la
    parte superior.
  </desc>
  <defs>
    <linearGradient
      id="laptop-metal"
      x1="0"
      y1="0"
      x2="0.9"
      y2="1"
      gradientUnits="objectBoundingBox"
    >
      <stop stop-color="#a6abb3" />
      <stop offset="0.22" stop-color="#818792" />
      <stop offset="0.54" stop-color="#717884" />
      <stop offset="1" stop-color="#505865" />
    </linearGradient>
    <radialGradient id="laptop-light" cx="0.13" cy="0.05" r="0.9">
      <stop stop-color="#fff" stop-opacity="0.44" />
      <stop offset="0.55" stop-color="#fff" stop-opacity="0" />
      <stop offset="1" stop-color="#172232" stop-opacity="0.15" />
    </radialGradient>
    <linearGradient id="laptop-edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b5bbc3" />
      <stop offset="0.25" stop-color="#4b5059" />
      <stop offset="0.7" stop-color="#242830" />
      <stop offset="1" stop-color="#0d1016" />
    </linearGradient>
    <filter
      id="laptop-grain"
      x="0"
      y="0"
      width="100%"
      height="100%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.75"
        numOctaves="3"
        seed="7"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.07" /></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" />
      <feBlend in="SourceGraphic" mode="soft-light" />
    </filter>
    <filter
      id="laptop-shadow"
      x="-25%"
      y="-25%"
      width="160%"
      height="170%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#30281d" flood-opacity="0.28" />
    </filter>
  </defs>

  <g id="lid-metal">
    <path
      d="M70 25H685Q706 25 710 47L746 396Q750 422 723 426H38Q10 421 17 397L45 48Q48 25 70 25Z"
      fill="url(#laptop-metal)"
      filter="url(#laptop-grain)"
    />
    <path
      d="M70 25H685Q706 25 710 47L746 396Q750 422 723 426H38Q10 421 17 397L45 48Q48 25 70 25Z"
      fill="url(#laptop-light)"
    />
    <path
      d="M70 25H685Q706 25 710 47L746 396Q750 422 723 426H38Q10 421 17 397L45 48Q48 25 70 25Z"
      fill="none"
      stroke="#e6e8ec"
      stroke-opacity="0.7"
      stroke-width="1.5"
    />
    <path
      d="M21 409Q22 425 43 426H720Q742 425 746 409"
      fill="none"
      stroke="#161d28"
      stroke-opacity="0.35"
      stroke-width="2"
    />
  </g>
  <g id="lid-monogram">
    <g transform="translate(330 188) scale(1.3)" fill="#20232a">
      <path d="M3 54V10h10l14 23 14-23h36v9H52v10h21v9H52v16H42V27L27 47 12 27v27Z" />
    </g>
  </g>
</svg>

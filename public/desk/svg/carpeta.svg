<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="470"
  height="620"
  viewBox="0 0 470 620"
  role="img"
  aria-labelledby="carpeta-title carpeta-description"
>
  <title id="carpeta-title">Carpeta sin anotaciones</title>
  <desc id="carpeta-description">
    Carpeta de papel kraft con documentos, respaldo azul y clip metálico. Todas las capas son
    vectoriales.
  </desc>
  <defs>
    <linearGradient id="folder-blue" x2="1" y2="1">
      <stop stop-color="#3c87b6" />
      <stop offset="1" stop-color="#075786" />
    </linearGradient>
    <linearGradient id="folder-paper" x2="1" y2="1">
      <stop stop-color="#f4d3a3" />
      <stop offset="0.45" stop-color="#e6bf8e" />
      <stop offset="1" stop-color="#cf9e69" />
    </linearGradient>
    <linearGradient id="folder-flap" x2="0.8" y2="1">
      <stop stop-color="#e9c997" />
      <stop offset="1" stop-color="#c69664" />
    </linearGradient>
    <linearGradient id="folder-clip" x2="1" y2="0">
      <stop stop-color="#242923" />
      <stop offset="0.2" stop-color="#d0c9ac" />
      <stop offset="0.42" stop-color="#666450" />
      <stop offset="0.7" stop-color="#f2ead1" />
      <stop offset="1" stop-color="#44453b" />
    </linearGradient>
    <filter
      id="folder-grain"
      x="0"
      y="0"
      width="100%"
      height="100%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.75"
        numOctaves="3"
        seed="11"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.12" /></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" />
      <feBlend in="SourceGraphic" mode="soft-light" />
    </filter>
    <filter
      id="folder-shadow"
      x="-25%"
      y="-25%"
      width="160%"
      height="170%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="3" dy="9" stdDeviation="7" flood-color="#30281d" flood-opacity="0.26" />
    </filter>
  </defs>
  <g transform="rotate(-12 235 310)" filter="url(#folder-shadow)">
    <path
      d="M110 57q0-15 15-15h240q15 0 15 15v464q0 14-15 14H110Z"
      fill="url(#folder-blue)"
      stroke="#145f82"
      stroke-width="1.3"
    />
    <path d="M65 68h262q12 0 12 12v28l38 13v426q0 16-18 16H65Z" fill="#b38a5c" />
    <path d="M59 73h267q13 0 13 13v467q0 14-15 14H59Z" fill="#e9d2aa" />
    <path d="M64 94h284v461H64Z" fill="#fff9ee" />
    <path d="M64 544h285M64 547h285M64 550h285" stroke="#cfc4ad" stroke-width="0.8" />
    <path
      d="M72 95h260q15 0 15 15v49l21 8v382q0 15-16 15H72q-17 0-17-17V112q0-17 17-17Z"
      fill="url(#folder-flap)"
      stroke="#ba8b5b"
      stroke-width="0.7"
    />
    <path
      d="M67 114h254q16 0 16 16v413q0 16-16 16H67q-16 0-16-16V130q0-16 16-16Z"
      fill="url(#folder-paper)"
      stroke="#bf986e"
      stroke-width="1"
      filter="url(#folder-grain)"
    />
    <path
      d="M64 119h258q10 0 10 12v408q0 15-16 15H65"
      fill="none"
      stroke="#fff0d5"
      stroke-opacity="0.6"
      stroke-width="1"
    />
    <path d="M78 115v439" stroke="#c19d72" stroke-width="0.8" opacity="0.42" />
    <path d="M66 559h253" stroke="#8c674a" stroke-width="1.5" opacity="0.55" />
    <g id="paperclip">
      <path
        d="M256 125V83c0-17 22-17 22 0v48c0 12-18 12-18 0V91c0-9 10-9 10 0v36"
        fill="none"
        stroke="#402f1b"
        stroke-opacity="0.35"
        stroke-width="5"
        transform="translate(2 3)"
      />
      <path
        d="M256 125V83c0-17 22-17 22 0v48c0 12-18 12-18 0V91c0-9 10-9 10 0v36"
        fill="none"
        stroke="url(#folder-clip)"
        stroke-width="4"
        stroke-linecap="round"
      />
      <path
        d="M257 124V84q0-9 9-10"
        fill="none"
        stroke="#fff9dd"
        stroke-width="0.8"
        opacity="0.85"
      />
    </g>
  </g>
</svg>

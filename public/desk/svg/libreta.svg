  role="img"
  aria-labelledby="libreta-title libreta-description"
>
  <title id="libreta-title">Libreta sin anotaciones</title>
  <desc id="libreta-description">
    Libreta cuadriculada con espiral metálica, sin contenido, para escribir sobre ella en HTML.
  </desc>
  <defs>
    <linearGradient id="notebook-cover" x2="1" y2="1">
      <stop stop-color="#234350" />
      <stop offset="0.6" stop-color="#152e39" />
      <stop offset="1" stop-color="#071b25" />
    </linearGradient>
    <linearGradient id="notebook-paper" x2="1" y2="1">
      <stop stop-color="#fffdf7" />
      <stop offset="0.45" stop-color="#faf8f1" />
      <stop offset="1" stop-color="#eae6dc" />
    </linearGradient>
    <linearGradient id="notebook-spine" x2="1" y2="0">
      <stop stop-color="#a89d85" />
      <stop offset="0.2" stop-color="#e2d6bf" />
      <stop offset="0.65" stop-color="#f2e9d9" />
      <stop offset="1" stop-color="#fffdf7" />
    </linearGradient>
    <linearGradient id="notebook-ring" x2="0.6" y2="1">
      <stop stop-color="#6f6858" />
      <stop offset="0.32" stop-color="#101312" />
      <stop offset="0.55" stop-color="#958973" />
      <stop offset="0.72" stop-color="#211f1b" />
      <stop offset="1" stop-color="#635a49" />
    </linearGradient>
    <pattern id="notebook-grid" x="80" y="40" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0v12" fill="none" stroke="#c6ccd0" stroke-opacity="0.48" stroke-width="0.55" />
    </pattern>
    <clipPath id="notebook-page-clip">
      <rect x="86" y="33" width="365" height="522" rx="9" />
    </clipPath>
    <filter
      id="notebook-paper-grain"
      x="0"
      y="0"
      width="100%"
      height="100%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.75"
        numOctaves="3"
        seed="3"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.035" /></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" />
      <feBlend in="SourceGraphic" mode="soft-light" />
    </filter>
    <filter
      id="notebook-shadow"
      x="-25%"
      y="-25%"
      width="160%"
      height="170%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#30281d" flood-opacity="0.3" />
    </filter>
  </defs>
